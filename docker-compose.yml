version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: policysentinel-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: policysentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policysentinel-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/policysentinel
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:8b
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      USE_MOCK_LLM: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/app/policies/definitions:/app/app/policies/definitions

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: policysentinel-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: policysentinel-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  ollamadata:
